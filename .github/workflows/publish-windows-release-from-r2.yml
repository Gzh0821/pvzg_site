name: Publish Windows release from R2

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version shared by the Release, tag, ZIP, and EXE (for example, 0.12.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-windows-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Windows ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate version and Release identity
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._-]{0,63}$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          zip_name="pvzge-${VERSION}.zip"
          exe_name="pvzge-${VERSION}.exe"
          r2_url="https://storage.pvzge.com/${zip_name}"
          release_api="https://api.github.com/repos/${RELEASE_REPOSITORY}/releases/tags/${VERSION}"
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT

          status=$(curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$release_api")

          case "$status" in
            200)
              release_tag=$(jq -r '.tag_name' "$response_file")
              release_name=$(jq -r '.name' "$response_file")
              release_draft=$(jq -r '.draft' "$response_file")
              if [[ "$release_tag" != "$VERSION" || "$release_name" != "$VERSION" ]]; then
                echo "Existing Release must use name and tag '$VERSION'" >&2
                echo "Found name='$release_name', tag='$release_tag'" >&2
                exit 1
              fi
              echo "RELEASE_EXISTS=true" >>"$GITHUB_ENV"
              echo "RELEASE_WAS_DRAFT=$release_draft" >>"$GITHUB_ENV"
              ;;
            404)
              echo "RELEASE_EXISTS=false" >>"$GITHUB_ENV"
              echo "RELEASE_WAS_DRAFT=true" >>"$GITHUB_ENV"
              ;;
            *)
              echo "Failed to inspect Release $VERSION: HTTP $status" >&2
              exit 1
              ;;
          esac

          {
            echo "ZIP_NAME=$zip_name"
            echo "EXE_NAME=$exe_name"
            echo "R2_URL=$r2_url"
          } >>"$GITHUB_ENV"

      - name: Download and validate the R2 ZIP
        shell: bash
        run: |
          set -euo pipefail

          download_url="${R2_URL}?gha-run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          downloaded=false
          for attempt in {1..10}; do
            if curl \
              --fail \
              --location \
              --continue-at - \
              --output "$ZIP_NAME" \
              "$download_url"; then
              downloaded=true
              break
            fi
            echo "R2 download attempt $attempt failed; the next attempt will resume" >&2
            sleep $((attempt * 2))
          done
          if [[ "$downloaded" != true ]]; then
            echo "Failed to download $R2_URL after 10 resumable attempts" >&2
            exit 1
          fi

          zip_size=$(stat --format='%s' "$ZIP_NAME")
          zip_sha256=$(sha256sum "$ZIP_NAME" | awk '{ print $1 }')
          mapfile -t entries < <(zipinfo -1 "$ZIP_NAME")

          if (( zip_size <= 0 || zip_size >= 2147483648 )); then
            echo "ZIP size $zip_size is empty or exceeds GitHub's 2 GiB limit" >&2
            exit 1
          fi
          if [[ "${#entries[@]}" -ne 1 || "${entries[0]}" != "$EXE_NAME" ]]; then
            echo "ZIP must contain exactly one file named $EXE_NAME" >&2
            printf 'Found: %s\n' "${entries[@]}" >&2
            exit 1
          fi

          unzip -tq "$ZIP_NAME"
          {
            echo "ZIP_SIZE=$zip_size"
            echo "ZIP_SHA256=$zip_sha256"
          } >>"$GITHUB_ENV"
          echo "Validated $ZIP_NAME ($zip_size bytes, sha256:$zip_sha256)"

      - name: Create a draft Release when absent
        if: env.RELEASE_EXISTS == 'false'
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$VERSION" \
            --repo "$RELEASE_REPOSITORY" \
            --target main \
            --title "$VERSION" \
            --generate-notes \
            --draft \
            --prerelease

      - name: Safely replace the Release asset
        shell: bash
        run: |
          set -euo pipefail

          expected_digest="sha256:${ZIP_SHA256}"
          temp_name="pvzge-${VERSION}.gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          ln "$ZIP_NAME" "$temp_name"
          trap 'rm -f "$temp_name"' EXIT

          release_id=$(gh api \
            "repos/${RELEASE_REPOSITORY}/releases/tags/${VERSION}" \
            --jq '.id')

          asset_id_by_name() {
            local asset_name=$1
            gh api --paginate \
              "repos/${RELEASE_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
              --jq ".[] | select(.name == \"$asset_name\") | .id"
          }

          delete_asset_by_name() {
            local asset_name=$1
            local asset_id
            asset_id=$(asset_id_by_name "$asset_name")
            if [[ -n "$asset_id" ]]; then
              gh api --method DELETE \
                "repos/${RELEASE_REPOSITORY}/releases/assets/${asset_id}"
            fi
          }

          uploaded=false
          for attempt in 1 2 3; do
            delete_asset_by_name "$temp_name"
            if gh release upload "$VERSION" "$temp_name" \
              --repo "$RELEASE_REPOSITORY"; then
              uploaded=true
              break
            fi
            echo "Temporary Release upload attempt $attempt failed" >&2
            sleep $((attempt * 5))
          done
          if [[ "$uploaded" != true ]]; then
            echo "Failed to upload the temporary Release asset after 3 attempts" >&2
            exit 1
          fi

          temp_id=$(asset_id_by_name "$temp_name")
          if [[ -z "$temp_id" ]]; then
            echo "Temporary Release asset is missing after upload" >&2
            exit 1
          fi
          temp_size=$(gh api \
            "repos/${RELEASE_REPOSITORY}/releases/assets/${temp_id}" \
            --jq '.size')
          temp_digest=$(gh api \
            "repos/${RELEASE_REPOSITORY}/releases/assets/${temp_id}" \
            --jq '.digest')
          if [[ "$temp_size" != "$ZIP_SIZE" || "$temp_digest" != "$expected_digest" ]]; then
            echo "Temporary Release asset failed size or SHA-256 validation" >&2
            exit 1
          fi

          delete_asset_by_name "$ZIP_NAME"
          gh api --method PATCH \
            "repos/${RELEASE_REPOSITORY}/releases/assets/${temp_id}" \
            -f "name=$ZIP_NAME" \
            --silent

          final_id=$(asset_id_by_name "$ZIP_NAME")
          final_size=$(gh api \
            "repos/${RELEASE_REPOSITORY}/releases/assets/${final_id}" \
            --jq '.size')
          final_digest=$(gh api \
            "repos/${RELEASE_REPOSITORY}/releases/assets/${final_id}" \
            --jq '.digest')
          if [[ "$final_size" != "$ZIP_SIZE" || "$final_digest" != "$expected_digest" ]]; then
            echo "Final Release asset failed size or SHA-256 validation" >&2
            exit 1
          fi

          release_name=$(gh api \
            "repos/${RELEASE_REPOSITORY}/releases/tags/${VERSION}" \
            --jq '.name')
          release_tag=$(gh api \
            "repos/${RELEASE_REPOSITORY}/releases/tags/${VERSION}" \
            --jq '.tag_name')
          if [[ "$release_name" != "$VERSION" || "$release_tag" != "$VERSION" ]]; then
            echo "Final Release name or tag does not match $VERSION" >&2
            exit 1
          fi

          if [[ "$RELEASE_WAS_DRAFT" == true ]]; then
            gh release edit "$VERSION" \
              --repo "$RELEASE_REPOSITORY" \
              --draft=false \
              --prerelease
          fi

          echo "Verified Release $VERSION with asset $ZIP_NAME"
